name: synchrosity

#   docker compose up --build
#   open http://localhost:8080
#   docker compose --profile seed run --rm seed
#
# Exposed on APP_PORT (default 8080), not 80/443 — reserved for the legacy app.
# Requires a remote MySQL server — configure DB_* in .env (see .env.example).

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-tracking_app}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-bill_dashboard_dev}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret}
      PORT: "8080"
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads_data:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: ./backend
    command: ["/app/seed"]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-tracking_app}
    restart: "no"

volumes:
  uploads_data:
