<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Synchrosity" />
    <meta name="description" content="Synchrosity: Align Your Home, Align Your Life" />
    <title>Synchrosity</title>
    <script>
      ;(() => {
        try {
          const stored = JSON.parse(localStorage.getItem('theme-storage') ?? '{}')
          const theme = stored.state?.theme ?? 'system'
          const valid = ['system', 'light', 'dark', 'ocean', 'forest', 'sunset', 'midnight']
          const selected = valid.includes(theme) ? theme : 'system'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const resolved =
            selected === 'system' ? (prefersDark ? 'dark' : 'light') : selected
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme =
            resolved === 'dark' || resolved === 'midnight' ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
